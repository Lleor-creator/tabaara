<style>
:root, html[data-theme="emerald"] {
  --bg: #F4F1EA; --card: #FFFCF7; --ink: #1C1C1E; --muted: #5c5e58; --line: #e0dacd;
  --brand: #1B4D3E; --on: #f4f7f5; --soft: #e5f0ea; --warn: #7a3e00; --bad: #8d2b2b;
  --badbg: #f8e6e4; --shadow: 0 10px 28px rgba(28, 28, 30, 0.06); color-scheme: light;
}
html[data-theme="daylight"] {
  --bg: #FFFFFF; --card: #FFFFFF; --ink: #000000; --muted: #222222; --line: #000000;
  --brand: #0A1128; --on: #FFFFFF; --soft: #F2F2F2; --warn: #000000; --bad: #000000;
  --badbg: #F2F2F2; --shadow: none; color-scheme: light;
}
html[data-theme="night"] {
  --bg: #121212; --card: #1c1c1c; --ink: #E0E0E0; --muted: #bdbdbd; --line: #333333;
  --brand: #2ECC71; --on: #102117; --soft: #163228; --warn: #f0c27a; --bad: #ffb4ae;
  --badbg: #3a1e1e; --shadow: none; color-scheme: dark;
}
html[data-theme="system"] {
  --bg: Canvas; --card: Canvas; --ink: CanvasText; --muted: GrayText; --line: GrayText;
  --brand: AccentColor; --on: AccentColorText; --soft: Canvas; --shadow: none;
  color-scheme: light dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
html { -webkit-font-smoothing: antialiased; font-size: 16px; }
html[data-density="compact"] { font-size: 14.5px; }
html[data-density="large"] { font-size: 18.5px; }
body {
  font: 1rem/1.45 "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  min-height: 100dvh;
}
button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; }
button:disabled { opacity: 0.45; cursor: default; }
button:active:not(:disabled) { transform: scale(0.98); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 2rem; letter-spacing: -0.03em; }
h2 { font-size: 1.2rem; letter-spacing: -0.02em; }
h3 { font-size: 1rem; margin: 0.8rem 0 0.2rem; }
p { margin: 0; text-wrap: pretty; }
.app { max-width: 28rem; margin: 0 auto; min-height: 100dvh; padding: 0 0.75rem; }
.top { padding: 0.35rem 0 0; }
.brand, .brand-static {
  display: flex; align-items: baseline; gap: 0.4rem;
  background: none; border: 0; padding: 0.85rem 0 0.15rem; margin: 0;
  color: var(--ink); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.03em; text-align: left;
}
.brand-mode { color: var(--brand); }
.brand-dot { color: var(--muted); font-weight: 500; }
.subhead { margin: 0 0 0.35rem; color: var(--muted); font-weight: 700; }
.screen { display: flex; flex-direction: column; gap: 0.85rem; padding: 0.35rem 0 8rem; }
.stack { display: flex; flex-direction: column; gap: 0.75rem; }
.card {
  background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 1.1rem; padding: 1rem; box-shadow: var(--shadow); overflow-x: auto;
}
html[data-density="compact"] .card { padding: 0.72rem; border-radius: 0.85rem; }
html[data-density="large"] .card { padding: 1.2rem; }
.hero { background: var(--brand); color: var(--on); border-radius: 1.15rem; padding: 1.05rem 1.1rem 1rem; }
.kicker { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 0.2rem; }
.hero .kicker, .hero-sub { color: var(--on); }
.hero-sub { opacity: 0.88; margin-top: 0.15rem; }
.hero-actions { margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
.hero-pill {
  min-height: 2.55rem; padding: 0.35rem 0.85rem; border-radius: 999px;
  border: 1.5px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.14);
  color: var(--on); font-weight: 700; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.35rem;
}
.sum { font-size: 1.85rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 0; }
.sum.ink { color: var(--ink); }
.muted, .hint, .fine { color: var(--muted); }
.hint { font-size: 0.95rem; }
.fine { font-size: 0.82rem; margin-top: 0.8rem; }
.amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.bad { color: var(--bad); }
.low { color: var(--warn); font-weight: 800; }
.split { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
.headrow { align-items: center; }
.stockcol { text-align: right; }
.price { color: var(--muted); margin-top: 0.15rem; }
.price-btn {
  display: inline-flex; align-items: center; min-height: 2.75rem; margin-top: 0.1rem;
  padding: 0.2rem 0; border: 0; background: none; color: var(--brand);
  font-weight: 800; text-align: left; text-decoration: underline; text-underline-offset: 3px;
}
.price-btn.on { color: var(--warn); }
.price-note { color: var(--muted); font-size: 0.82rem; margin: 0; }
.product { display: flex; flex-direction: column; gap: 0.8rem; }
.stepper { display: flex; gap: 0.5rem; }
.stepper .step, .stepper input {
  min-height: 4.25rem; border-radius: 0.95rem; border: 2px solid var(--ink); background: var(--card);
}
html[data-density="compact"] .stepper .step,
html[data-density="compact"] .stepper input { min-height: 3.35rem; }
html[data-density="large"] .stepper .step,
html[data-density="large"] .stepper input { min-height: 5rem; }
.stepper .step { width: 4.25rem; font-size: 2rem; font-weight: 700; line-height: 1; padding: 0; }
html[data-density="compact"] .stepper .step { width: 3.35rem; }
html[data-density="large"] .stepper .step { width: 5rem; font-size: 2.4rem; }
.stepper input {
  flex: 1; min-width: 0; text-align: center; font-size: 1.45rem; font-weight: 700;
  font-variant-numeric: tabular-nums; border-color: var(--line);
}
.btn, .quiet, .danger {
  min-height: 3.35rem; border-radius: 0.95rem; padding: 0.75rem 1rem; font-weight: 700;
  width: 100%; border: 1.5px solid transparent; display: inline-flex; align-items: center; justify-content: center;
}
html[data-density="compact"] .btn,
html[data-density="compact"] .quiet,
html[data-density="compact"] .danger { min-height: 2.85rem; padding: 0.55rem 0.8rem; }
html[data-density="large"] .btn,
html[data-density="large"] .quiet,
html[data-density="large"] .danger { min-height: 3.9rem; }
.btn { background: var(--brand); color: var(--on); }
.sell { min-height: 4rem; font-size: 1.15rem; }
.slim { width: auto; min-height: 2.75rem; padding: 0.4rem 0.9rem; }
.quiet { background: var(--card); color: var(--ink); border-color: var(--line); }
.danger { background: var(--badbg); color: var(--bad); }
.mini, .textlink, .back {
  min-height: 2.75rem; border-radius: 0.8rem; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); font-weight: 700; padding: 0.35rem 0.8rem; width: auto;
}
.textlink, .back { background: none; border: 0; padding-left: 0; color: var(--brand); scroll-margin-bottom: 6rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.chips button {
  min-height: 3rem; padding: 0.4rem 0.85rem; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); font-weight: 700;
}
.chips button[aria-pressed="true"] { background: var(--brand); color: var(--on); border-color: var(--brand); }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.nav-in { width: min(28rem, 100%); display: flex; overflow-x: auto; }
.nav button {
  flex: 1 0 auto; min-width: 4.35rem; min-height: 4rem; border: 0; background: transparent;
  color: var(--muted); font-weight: 700; font-size: 0.82rem; padding: 0.25rem 0.4rem;
}
html[data-density="compact"] .nav button { min-height: 3.4rem; min-width: 3.8rem; }
html[data-density="large"] .nav button { min-height: 4.6rem; }
.nav button[aria-current="page"] { color: var(--brand); box-shadow: inset 0 3px 0 var(--brand); }
.section { margin-top: 0.4rem; }
.field { display: flex; flex-direction: column; gap: 0.3rem; }
label { font-size: 0.92rem; font-weight: 700; }
input, select {
  width: 100%; min-height: 3.25rem; border-radius: 0.9rem; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 0.55rem 0.8rem;
}
.list { display: flex; flex-direction: column; }
.rowline { display: flex; justify-content: space-between; gap: 0.75rem; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
.rowline:last-child { border-bottom: 0; }
.line-end { display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; }
.debt { padding: 0.7rem 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.35rem; }
.debt:last-child { border-bottom: 0; }
table.grid {
  width: 100%; border-collapse: collapse; margin-top: 0.55rem;
  border: 1.5px solid var(--ink);
}
table.grid th, table.grid td {
  border: 1px solid var(--ink); padding: 0.45rem 0.5rem; vertical-align: top; text-align: left;
}
table.grid th {
  font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; background: var(--soft); font-weight: 800;
}
table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.grid tr.total td { font-weight: 800; border-top: 2px solid var(--ink); }
.exp-deleted, .sale-deleted, .exp-deleted td, .exp-deleted b, .exp-deleted p, .exp-deleted span, .sale-deleted td, .sale-deleted b, .sale-deleted p, .sale-deleted span {
  text-decoration: line-through;
  color: var(--muted) !important;
  opacity: 0.65;
}
.row-actions { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.mini.danger { background: var(--badbg); color: var(--bad); border-color: transparent; }
.density {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.25rem; padding: 0.25rem;
  border: 1.5px solid var(--line); border-radius: 999px; background: var(--bg);
}
.density button {
  min-height: 3rem; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font-weight: 700;
}
.density button[aria-pressed="true"] { background: var(--brand); color: var(--on); }
.feed { display: flex; flex-direction: column; gap: 0.25rem; }
.pill { font-size: 0.75rem; font-weight: 700; color: var(--brand); background: var(--soft); border-radius: 999px; padding: 0.3rem 0.55rem; }
.pill.warn { color: var(--warn); }
.banner, .oknote, .badnote { border-radius: 0.9rem; padding: 0.75rem 0.9rem; }
.banner, .oknote { background: var(--soft); color: var(--ink); }
.badnote { background: var(--badbg); color: var(--bad); }
.code { font-size: 2rem; letter-spacing: 0.18rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.link { font-size: 0.82rem; word-break: break-all; color: var(--muted); }
.qr { background: #fff; border-radius: 0.8rem; padding: 0.45rem; width: max-content; max-width: 100%; }
.qr svg { display: block; }
.theme-opt {
  width: 100%; display: flex; gap: 0.8rem; align-items: center; text-align: left;
  min-height: 4.25rem; padding: 0.7rem 0.8rem; border-radius: 1rem; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink);
}
.theme-opt[aria-pressed="true"] { border-color: var(--brand); background: var(--soft); }
.theme-opt b, .theme-opt small { display: block; }
.theme-opt small { color: var(--muted); font-weight: 500; margin-top: 0.1rem; }
.sw { display: flex; gap: 4px; flex: none; }
.sw i { width: 16px; height: 16px; border-radius: 50%; display: block; border: 1px solid rgba(0,0,0,0.25); }
.sw-emerald i:nth-child(1) { background: #F4F1EA; } .sw-emerald i:nth-child(2) { background: #1B4D3E; } .sw-emerald i:nth-child(3) { background: #1C1C1E; }
.sw-daylight i:nth-child(1) { background: #FFFFFF; } .sw-daylight i:nth-child(2) { background: #0A1128; } .sw-daylight i:nth-child(3) { background: #000000; }
.sw-night i:nth-child(1) { background: #121212; } .sw-night i:nth-child(2) { background: #2ECC71; } .sw-night i:nth-child(3) { background: #E0E0E0; }
.sw-system i:nth-child(1) { background: Canvas; } .sw-system i:nth-child(2) { background: AccentColor; } .sw-system i:nth-child(3) { background: CanvasText; }
.choice {
  width: 100%; text-align: left; border-radius: 1rem; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); padding: 0.85rem 0.9rem; min-height: 4.5rem;
  display: flex; flex-direction: column; gap: 0.2rem;
}
.choice.on { border-color: var(--brand); background: var(--soft); }
.choice-title { font-weight: 700; font-size: 1.05rem; }
.choice-copy { color: var(--muted); font-size: 0.92rem; }
.drawer-bg, .sheet-bg { position: fixed; inset: 0; background: rgba(18, 18, 18, 0.46); z-index: 30; }
.drawer { width: min(28rem, 100%); margin: 0 auto; background: var(--card); color: var(--ink); border-radius: 0 0 1.25rem 1.25rem; padding: 0.75rem 1rem 1.15rem; display: flex; flex-direction: column; gap: 0.65rem; }
.sheet-bg { display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: min(28rem, 100%); max-height: 92dvh; overflow: auto; background: var(--card); color: var(--ink);
  border-radius: 1.25rem 1.25rem 0 0; padding: 1rem 1rem calc(1.1rem + env(safe-area-inset-bottom));
}
.gate { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; gap: 0.75rem; padding: 1.5rem 0 2rem; }
.gate h1 { font-size: 1.7rem; }
body.noscroll { overflow: hidden; }
.credit { font-size: 0.72rem; letter-spacing: 0.08em; font-weight: 700; color: var(--muted); text-align: center; margin: 0.6rem 0 0; }
.splash {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); color: var(--ink); overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
}
.bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--line); }
.bar span { display: block; height: 100%; width: 0; background: var(--brand); animation: fill 2s linear forwards; }
.splash-mid { margin: auto; max-width: 24rem; padding: 1.5rem 1.25rem 0; text-align: center; position: relative; z-index: 1; }
.shop { width: 132px; height: auto; color: var(--brand); }
.shop .draw { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 0.9s ease forwards; }
.shop .awn { fill: currentColor; opacity: 0; animation: fadein 0.4s ease 0.85s forwards; }
.splash h1 { margin-top: 0.8rem; opacity: 0; animation: rise 0.4s ease 0.35s forwards; }
.lede { color: var(--muted); margin-top: 0.45rem; opacity: 0; animation: rise 0.45s ease 0.5s forwards; }
.splash .credit { padding: 0 1rem calc(1rem + env(safe-area-inset-bottom)); }
.sat {
  position: absolute; z-index: 2; width: 56px; height: 56px; display: grid; place-items: center;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; color: var(--brand);
  box-shadow: var(--shadow); opacity: 0;
}
.sat svg { width: 28px; height: 28px; }
.sat path, .sat circle { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sat.bread { left: max(16px, 6vw); top: 42%; animation: fromL 0.75s cubic-bezier(.2,.8,.2,1) 0.55s forwards; }
.sat.hard { right: max(16px, 6vw); top: 38%; animation: fromR 0.75s cubic-bezier(.2,.8,.2,1) 0.7s forwards; }
.sat.mill { top: max(20px, 7vh); left: 50%; margin-left: -28px; animation: fromT 0.75s cubic-bezier(.2,.8,.2,1) 0.85s forwards; }
.sat.store { bottom: max(88px, 12vh); left: 50%; margin-left: -28px; animation: fromB 0.75s cubic-bezier(.2,.8,.2,1) 1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fill { to { width: 100%; } }
@keyframes fromL { from { transform: translateX(-70vw); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fromR { from { transform: translateX(70vw); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fromT { from { transform: translateY(-40vh); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fromB { from { transform: translateY(40vh); opacity: 0; } to { transform: none; opacity: 1; } }
html[data-theme="daylight"] .card,
html[data-theme="daylight"] .quiet,
html[data-theme="daylight"] .theme-opt,
html[data-theme="daylight"] .choice,
html[data-theme="daylight"] .density,
html[data-theme="daylight"] input,
html[data-theme="daylight"] select,
html[data-theme="daylight"] .chips button { border-width: 2px; }
html[data-theme="daylight"] .low { text-decoration: underline; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .shop .draw { stroke-dashoffset: 0; }
  .shop .awn, .sat, .splash h1, .lede, .bar span { opacity: 1; width: 100%; transform: none; }
  button:active { transform: none; }
}
@media print {
  .nav, .noprint, .splash, .top, .textlink, .chips, .btn, .quiet, .mini, .danger, .drawer-bg, .sheet-bg, .back { display: none !important; }
  body, .app { background: #fff !important; color: #111 !important; }
  .app, .screen { padding: 0 !important; max-width: none; gap: 0.4rem; }
  .card { box-shadow: none; border: 0; padding: 0; background: #fff !important; color: #111 !important; overflow: visible; }
  h2, h3, p { color: #111; }
  table.grid { border: 1.5px solid #111 !important; }
  table.grid th, table.grid td { border: 1px solid #111 !important; color: #111 !important; background: #fff !important; }
  table.grid th, table.grid tr.total td {
    background: #eee !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
@page { margin: 12mm; }

/* Tabaara lightweight in-app guide */
.help-btn{min-width:2.45rem;min-height:2.45rem;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:800;color:var(--brand);padding:.25rem .65rem}
.help-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:.75rem}
.help-card{width:min(28rem,100%);max-height:88dvh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:1.25rem;padding:1rem;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.help-progress{display:flex;gap:.3rem;margin:.15rem 0 .8rem}.help-dot{height:.3rem;flex:1;border-radius:99px;background:var(--line)}.help-dot.on{background:var(--brand)}
.help-choice{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:.9rem;padding:.8rem;margin-top:.5rem;font-weight:700}.help-choice.on{border:2px solid var(--brand);background:var(--soft)}
.help-emoji{font-size:1.65rem;margin-bottom:.35rem}.help-actions{display:flex;gap:.5rem;margin-top:1rem}.help-actions>*{flex:1}.help-skip{background:none;border:0;color:var(--muted);font-weight:700;padding:.6rem}

/* Smooth transitions */
.screen, .gate, .drawer, .sheet, .shell {
  animation: fadeIn 0.28s ease;
}
#main {
  transition: opacity 0.18s ease;
}

let ownerUid = null;
let shiftUnsub = null;

function initSync() {
  if (!FIREBASE_CONFIG || typeof firebase === "undefined") return;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    auth = firebase.auth();
    syncEnabled = true;
    auth.onAuthStateChanged((user) => {
      ownerUid = user ? user.uid : null;
      if (ownerUid && state.profile === "manager") startShiftListener();
    });
  } catch (e) { console.warn("Sync init failed", e); }
}

function requireOwner() {
  return syncEnabled && auth && auth.currentUser;
}

async function ownerSignIn(email, password) {
  if (!syncEnabled) { toast("Online Manager is not configured yet.", true); return; }
  try {
    await auth.signInWithEmailAndPassword(email, password);
    toast("Signed in as owner.");
    if (state.profile === "manager") startShiftListener();
  } catch (e) {
    toast(e.message || "Sign-in failed.", true);
  }
}

async function ownerSignUp(email, password) {
  if (!syncEnabled) { toast("Online Manager is not configured yet.", true); return; }
  try {
    await auth.createUserWithEmailAndPassword(email, password);
    toast("Owner account created.");
  } catch (e) {
    toast(e.message || "Could not create account.", true);
  }
}

function ownerSignOut() {
  if (auth) auth.signOut();
  ownerUid = null;
  stopShiftListener();
  toast("Signed out.");
}

function currentShiftToken() {
  return (state.shift && state.shift.token) || null;
}

function pushShiftEntry(entry) {
  if (!syncEnabled || !db || !currentShiftToken()) return;
  const token = currentShiftToken();
  db.ref("shifts/" + token + "/entries").push({
    ...entry,
    at: entry.at || Date.now(),
    by: entry.by || cashierLabel()
  }).catch(() => {});
}

function startShiftListener() {
  if (!syncEnabled || !db || !ownerUid || shiftUnsub) return;
  // Owner listens to all shifts they created (stored under their uid).
  const ref = db.ref("owners/" + ownerUid + "/shifts");
  shiftUnsub = ref.on("child_added", (snap) => {
    const token = snap.key;
    db.ref("shifts/" + token + "/entries").on("child_added", (entrySnap) => {
      const entry = entrySnap.val();
      if (!entry || !entry.id) return;
      const exists = (state.manager.inbox || []).some(i => i.id === entry.id);
      if (exists) return;

      if (entry.kind === "sale" && entry.sale) {
        if (!(state.manager.sales || []).some(s => s.id === entry.sale.id)) {
          state.manager.sales.unshift(entry.sale);
          const product = (state.manager.products || []).find(p => p.id === entry.sale.productId);
          if (product && entry.sale.qty) {
            product.stock = roundQty(Math.max(0, product.stock - entry.sale.qty));
          }
        }
      } else if (entry.kind === "expense" && entry.expense) {
        if (!(state.manager.expenses || []).some(e => e.id === entry.expense.id)) {
          state.manager.expenses.unshift(entry.expense);
        }
      } else if (entry.kind === "debt" && entry.debt) {
        const bucket = entry.debtKind === "pay" ? state.manager.payables : state.manager.receivables;
        if (!(bucket || []).some(d => d.id === entry.debt.id)) bucket.unshift(entry.debt);
      }

      logInbox({
        id: entry.id,
        at: entry.at,
        kind: entry.kind || "sale",
        debtId: entry.kind === "debt" ? entry.debtId || entry.id : undefined,
        title: (entry.by || "Cashier") + " · " + (entry.title || "Sale"),
        detail: entry.detail || "",
        amount: entry.amount || 0
      });
      save();
      if (typeof render === "function") render();
    });
  });
}

async function loadRemoteShift(token) {
  if (!token) return false;
  // Wait briefly for Firebase init on a fresh phone
  for (let i = 0; i < 10 && (!syncEnabled || !db); i++) {
    await new Promise(r => setTimeout(r, 300));
  }
  if (!syncEnabled || !db) return false;
  try {
    const snap = await db.ref("shifts/" + token + "/meta").once("value");
    const meta = snap.val();
    if (!meta || !meta.keyHash) return false;
    if (meta.ended === true || (meta.end && Date.now() >= meta.end)) {
      lockClosedShift(token, meta.ended === true ? "closed" : "expired");
      return false;
    }
    if (meta.owner && ownerUid && meta.owner !== ownerUid) return false;

    state.shift = {
      id: meta.id || uid(),
      keyHash: meta.keyHash,
      token,
      hours: meta.hours || Math.max(1, Math.round((meta.end - (meta.start || Date.now())) / 3600000)),
      start: meta.start || Date.now(),
      end: meta.end,
      cashierName: meta.cashierName || "Cashier"
    };

    const sameCashierSession = !!(state.cashierSession && state.cashierSession.token === token);
    if (!sameCashierSession) {
      const cashierBook = blankBook("c-", false);
      cashierBook.shopName = meta.shopName || "My Shop";
      cashierBook.products = Array.isArray(meta.products) ? JSON.parse(JSON.stringify(meta.products)) : [];
      cashierBook.sales = [];
      cashierBook.expenses = [];
      cashierBook.receivables = [];
      cashierBook.payables = [];
      cashierBook.inbox = [];
      state.manager = cashierBook;
    } else if (Array.isArray(meta.products) && Array.isArray(state.manager.products) && !state.manager.products.length) {
      state.manager.products = JSON.parse(JSON.stringify(meta.products));
    }
    state.cashierSession = { token, startedAt: state.cashierSession && state.cashierSession.startedAt || Date.now() };
    state.shiftLock = null;
    ui.shiftLock = false;
    if (ui.gate === "shift") ui.gate = "";
    ui.cashier = true;
    ui.badLink = false;
    ui.shiftEnded = false;
    ui.settings = false;
    ui.tab = "sell";
    save();
    listenForShiftEnd(token);
    return true;
  } catch (err) {
    console.warn("Could not load cashier shift", err);
    return false;
  }
}

let shiftEndRef = null;
function listenForShiftEnd(token) {
  if (!syncEnabled || !db || !token) return;
  if (shiftEndRef) { shiftEndRef.off(); shiftEndRef = null; }
  shiftEndRef = db.ref("shifts/" + token + "/meta/ended");
  shiftEndRef.on("value", (snap) => {
    // Only react for the shift this phone is actually running.
    if (snap.val() === true && ui.cashier && currentShiftToken() === token) {
      lockClosedShift(token, "closed");
      if (typeof render === "function") render();
    }
  });
}

function stopShiftListener() {
  if (shiftUnsub && db && ownerUid) {
    db.ref("owners/" + ownerUid + "/shifts").off("child_added", shiftUnsub);
    shiftUnsub = null;
  }
}

function registerShiftToken(token, hours, cashierName) {
  if (!syncEnabled || !db || !ownerUid) return;
  const start = Date.now();
  const end = start + hours * 3600000;
  // Never send the manager's books to a cashier device. The till receives
  // only the product catalogue and the minimum shift metadata it needs.
  const products = JSON.parse(JSON.stringify((state.manager && state.manager.products) || []));
  const shiftMeta = {
    id: state.shift && state.shift.id,
    owner: ownerUid,
    cashierName: cashierName || "Cashier",
    keyHash: state.shift && state.shift.keyHash,
    hours,
    start,
    end,
    shopName: (state.manager && state.manager.shopName) || "My Shop",
    products
  };
  db.ref("owners/" + ownerUid + "/shifts/" + token).set({
    cashierName: cashierName || "Cashier",
    end,
    created: start
  });
  db.ref("shifts/" + token + "/meta").set(shiftMeta).catch(() => {});
}

function sha256(ascii) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  const maxWord = 2 ** 32;
  let result = "";
  const words = [];
  const asciiBitLength = ascii.length * 8;
  let hash = sha256.h = sha256.h || [];
  const k = sha256.k = sha256.k || [];
  let primeCounter = k.length;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += "\x80";
  while (ascii.length % 64 - 56) ascii += "\x00";
  for (let i = 0; i < ascii.length; i++) {
    words[i >> 2] |= ascii.charCodeAt(i) << ((3 - i) % 4) * 8;
  }
  words[words.length] = (asciiBitLength / maxWord) | 0;
  words[words.length] = asciiBitLength;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, (j += 16));
    const oldHash = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ (~e & hash[6]))
        + k[i]
        + (w[i] = i < 16 ? w[i] : (w[i - 16]
          + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
          + w[i - 7]
          + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
      const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++) {
    for (let j = 3; j + 1; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      result += (b < 16 ? "0" : "") + b.toString(16);
    }
  }
  return result;
}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);

  Object.keys(props).forEach((key) => {
    const val = props[key];
    if (val == null || val === false) return;
    if (key === "class") el.className = val;
    else if (key === "text") el.textContent = String(val);
    else el.setAttribute(key, String(val));
  });
  kids.flat().forEach((kid) => {
    if (kid == null || kid === false) return;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  });

}

function splitLegacyDebts(book) {

  let moved = false;
  if (!Array.isArray(book.receivables)) { book.receivables = []; moved = true; }
  if (!Array.isArray(book.payables)) { book.payables = []; moved = true; }
  if (Array.isArray(book.debts) && book.debts.length) {
    book.debts.forEach((d) => {
      if (d && d.direction === "owing") book.payables.push(d);
      else if (d) book.receivables.push(d);

  }

}
function normalize(data) {

  if (!SUPPORTED_LANGS.includes(data.lang)) { data.lang = "en"; moved = true; }
  if (data.density !== "compact" && data.density !== "normal" && data.density !== "large") {
    data.density = "normal";

  }
  if (typeof data.soloPinHash !== "string") { data.soloPinHash = ""; moved = true; }
  if (!data.shiftLock || typeof data.shiftLock !== "object") { data.shiftLock = null; moved = true; }
  if (!data.cashierSession || typeof data.cashierSession !== "object") { data.cashierSession = null; moved = true; }
  if (typeof data.lastBackupAt !== "number") { data.lastBackupAt = 0; moved = true; }
  if (typeof data.pinFails !== "number") { data.pinFails = 0; moved = true; }
  if (typeof data.pinLockUntil !== "number") { data.pinLockUntil = 0; moved = true; }
  if (typeof data.soloFails !== "number") { data.soloFails = 0; moved = true; }
  if (typeof data.soloLockUntil !== "number") { data.soloLockUntil = 0; moved = true; }
  if (typeof data.modesIntroSeen !== "boolean") { data.modesIntroSeen = false; moved = true; }
  if (!data.helpSeenTabs || typeof data.helpSeenTabs !== "object") { data.helpSeenTabs = {}; moved = true; }
  if (splitLegacyDebts(data.solo)) moved = true;
  if (splitLegacyDebts(data.manager)) moved = true;
  data._migrated = moved;
  return data;
}

}

}

}

function load() {
  try {
    let raw = storeGet(KEY);
    let migratedFromLegacy = false;
    if (!raw) {
      raw = storeGet(LEGACY_KEY);
      if (raw) migratedFromLegacy = true;
    }
    if (!raw) return seed();
    const data = JSON.parse(raw);
    if (!data || data.v !== 3 || !data.solo || !data.manager || !Array.isArray(data.solo.products)) return seed();
    if (!Array.isArray(data.manager.inbox)) data.manager.inbox = [];
    const norm = normalize(data);
    if (migratedFromLegacy) norm._migrated = true;
    return norm;
  } catch (err) {
    return seed();
  }
}

  const allSales = book.sales.filter((s) => inPeriod(s.date, period));
  const sales = allSales.filter((s) => !s.deleted);

  const exps = allExps.filter((e) => !e.deleted);
  const revenue = sales.reduce((sum, s) => sum + s.total, 0);
  const cogs = sales.reduce((sum, s) => sum + Math.round(s.costPrice * s.qty), 0);

function sellCard(p) {
  const qty = qtyOf(p.id);
  const qn = parseQty(qty);
  const deal = priceOf(p);
  const changed = deal !== p.sellingPrice;
  const out = p.stock <= 0;
  const tooMany = qn > p.stock + 1e-9;
  const low = p.stock > 0 && p.stock <= 5;
  const card = h("article", { class: "card product" });
  const top = h("div", { class: "split" });
  const title = h("div", {},
    h("h2", { text: p.name }),
    h("button", {
      type: "button",
      class: "price-btn" + (changed ? " on" : ""),
      "data-act": "price",
      "data-id": p.id,
      text: ugx(deal) + " / " + p.unit
    }),
    h("p", { class: "price-note", text: changed ? t("override") + " · " + t("shelf") + " " + ugx(p.sellingPrice) : t("tapPrice") })
  );
  const stock = h("div", { class: "stockcol" },
    h("p", { class: "amt" + (out ? " bad" : low ? " low" : ""), text: qfmt(p.stock) }),
    h("p", { class: "muted", text: out ? t("out") : p.unit + (low ? " · " + t("low") : "") })
  );
  top.append(title, stock);
  card.append(top, stepper(p));
  const label = qn > 0 && !tooMany && !out ? t("sell") + "  " + ugx(Math.round(qn * deal)) : t("sell");
  const btn = h("button", { type: "button", class: "btn sell", "data-act": "sale", "data-id": p.id, text: label });
  if (out || tooMany || qn <= 0) btn.disabled = true;
  card.append(btn);
  if (tooMany && !out) card.append(h("p", { class: "hint bad", text: t("only") + " " + qfmt(p.stock) + " " + p.unit + " " + t("left") }));
  return card;
}

function gridTable(headers, rows, total) {
  const table = h("table", { class: "grid" });
  const head = h("tr");
  headers.forEach((label, i) => {
    head.append(h("th", { class: i === headers.length - 1 ? "num" : "", scope: "col", text: label }));
  });
  table.append(h("thead", {}, head));
  const body = h("tbody");
  function paint(rowObj, extra) {
    const cells = Array.isArray(rowObj) ? rowObj : rowObj.cells;
    const cls = Array.isArray(rowObj) ? (extra || "") : [extra, rowObj.cls].filter(Boolean).join(" ");
    const tr = h("tr", { class: cls });
    cells.forEach((cell, i) => {
      const td = h("td", { class: i === cells.length - 1 ? "num" : "" });
      if (cell instanceof Node) td.append(cell);
      else td.textContent = String(cell);
      tr.append(td);
    });
    body.append(tr);
  }
  rows.forEach((r) => paint(r, ""));
  if (total) paint(total, "total");
  table.append(body);
  return table;
}

function qrNode(text) {
  const box = h("div", { class: "qr" });
  if (typeof qrcode !== "function") {
    box.append(h("p", { text: "Use the link below." }));
    return box;
  }
  try {
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    box.innerHTML = qr.createSvgTag(4, 2);
  } catch (err) {
    box.append(h("p", { text: "Use the link below." }));
  }
  return box;
}

  QUICK_EXPENSES.forEach((qe) => {
    const label = t(qe.key);
    const active = (ui.bind.note || "") === label && (ui.bind.cat || "Transport") === qe.cat;
    chips.append(h("button", {
      type: "button", "data-act": "quick-exp", "data-cat": qe.cat, "data-label": label,
      "aria-pressed": active ? "true" : "false", text: label
    }));
  });
  return chips;
}

function cashView() {
  const book = ledger();
  const today = book.expenses.filter((e) => e.date === iso());
  const wrap = h("div", { class: "stack" });
  wrap.append(h("h2", { text: t("petty") }));
  wrap.append(h("p", { class: "hint", text: t("quickPickLabel") }));
  wrap.append(quickExpenseChips());
  wrap.append(field(t("amount"), "amount", "numeric", ui.bind.amount || ""));
  const chips = h("div", { class: "chips" });
  CATS.forEach((cat) => {
    chips.append(h("button", {
      type: "button", "data-act": "cat", "data-cat": cat,
      "aria-pressed": (ui.bind.cat || "Transport") === cat ? "true" : "false",
      text: catLabel(cat)
    }));
  });
  wrap.append(chips, field(t("note"), "note", "text", ui.bind.note || ""));
  wrap.append(h("button", { type: "button", class: "btn", "data-act": "save-exp", text: t("savePetty") }));
  const list = h("div", { class: "list" });
  if (!today.length) list.append(h("p", { class: "muted", text: t("noPayoutsToday") }));
  today.forEach((e) => {
    const right = h("div", { class: "line-end" }, h("span", { class: "amt", text: ugx(e.amount) }));
    if (!e.deleted) {
      const btns = h("div", { class: "row-actions" });
      if (canEditExpense(e)) {
        btns.append(h("button", { type: "button", class: "mini", "data-act": "edit-exp", "data-id": e.id, text: t("edit") }));
      }
      btns.append(h("button", { type: "button", class: "mini danger", "data-act": "del-exp", "data-id": e.id, text: t("deleteWord") }));
      right.append(btns);
    } else {
      right.append(h("span", { class: "muted", text: t("deletedWord") }));
    }
    list.append(h("div", { class: "rowline" + (e.deleted ? " exp-deleted" : "") },
      h("div", {}, h("b", { text: catLabel(e.category) }), h("p", { class: "muted", text: e.note || clock(e.at) })),
      right
    ));
  });
  wrap.append(h("article", { class: "card" }, list));
  wrap.append(debtPanel("rec"), debtPanel("pay"));
  return wrap;
}

function shell() {
  const wrap = h("div", { class: "shell" });
  wrap.append(header());
  const screen = h("main", { class: "screen" });
  if (ui.notice) screen.append(note(ui.notice, ui.noticeBad));
  screen.append(ui.settings ? settingsView() : bodyFor(currentTab()));
  wrap.append(screen, nav());
  if (ui.drawer) wrap.append(drawer());
  if (ui.sheet) wrap.append(sheet());
  if (ui.langOpen) wrap.append(languageIntroView());
  else if (ui.modesOpen) wrap.append(modesIntroView());
  else if (ui.helpOpen) wrap.append(helpView());
  return wrap;
}

function unitSelect() {

  UNITS.forEach((unit) => {
    const opt = h("option", { value: unit, text: unit });
    if ((ui.bind.unit || "piece") === unit) opt.selected = true;
    sel.append(opt);
  });
  return h("div", { class: "field" }, h("label", { text: "Unit" }), sel);

function sheetBody() {
  if (ui.sheet === "confirm" && ui.pending) {
    const p = productById(ui.pending.id);
    const unit = ui.pending.unitPrice != null ? ui.pending.unitPrice : (p ? p.sellingPrice : 0);
    const total = Math.round(ui.pending.qty * unit);
    const changed = p && unit !== p.sellingPrice;
    return h("div", { class: "stack" },
      h("h2", { text: t("confirmSale") }),
      h("p", { text: qfmt(ui.pending.qty) + " " + (p ? p.unit : "") + " " + (p ? p.name : "") }),
      h("p", { class: "sum ink", text: ugx(total) }),
      changed ? h("p", { class: "hint", text: t("override") + " · " + t("shelf") + " " + ugx(p.sellingPrice) }) : null,
      h("button", { type: "button", class: "btn", "data-act": "commit", text: t("confirmSale") }),
      h("button", { type: "button", class: "quiet", "data-act": "close", text: t("cancel") })
    );
  }
  if (ui.sheet === "price") {
    const p = productById(ui.bind.id);
    return h("div", { class: "stack" },
      h("h2", { text: p ? p.name : t("thisSalePrice") }),
      h("p", { class: "hint", text: t("shelf") + " " + ugx(p ? p.sellingPrice : 0) + (p ? " / " + p.unit : "") }),
      field(t("thisSalePrice"), "deal", "numeric", ui.bind.deal || ""),
      h("p", { class: "hint", text: t("tapPrice") }),
      h("button", { type: "button", class: "btn", "data-act": "save-price", text: t("savePrice") }),
      h("button", { type: "button", class: "quiet", "data-act": "clear-price", text: t("useShelf") })
    );
  }
  if (ui.sheet === "product") {
    return h("div", { class: "stack" },
      h("h2", { text: ui.bind.id ? "Edit product" : "New product" }),
      field("Name", "name", "text", ui.bind.name || ""),
      unitSelect(),
      field("Current stock", "stock", "decimal", ui.bind.stock || ""),
      field("Cost price", "cost", "numeric", ui.bind.cost || ""),
      field("Selling price", "sell", "numeric", ui.bind.sell || ""),
      h("button", { type: "button", class: "btn", "data-act": "save-product", text: "Save" }),
      ui.bind.id ? h("button", { type: "button", class: "danger", "data-act": "del-product", text: "Delete product" }) : null
    );
  }
  if (ui.sheet === "recv") {

function render() {
  applyTheme();
  const now = Date.now();
  if (now < (state.pinLockUntil || 0)) {
    const mins = Math.ceil((state.pinLockUntil - now) / 60000);
    ui.passMsg = "Too many tries. Try again in " + mins + " minute" + (mins === 1 ? "" : "s") + ".";
  } else if (state.pinLockUntil && now >= state.pinLockUntil && ui.passMsg.indexOf("Too many tries") === 0) {
    state.pinLockUntil = 0;
    state.pinFails = 0;
    save();
    ui.passMsg = "";
  }
  if (ui.gate === "solo" && now < (state.soloLockUntil || 0)) {
    const mins = Math.ceil((state.soloLockUntil - now) / 60000);
    ui.passMsg = "Too many tries. Try again in " + mins + " minute" + (mins === 1 ? "" : "s") + ".";
  } else if (ui.gate === "solo" && state.soloLockUntil && now >= state.soloLockUntil && ui.passMsg.indexOf("Too many tries") === 0) {
    state.soloLockUntil = 0;
    state.soloFails = 0;
    save();
    ui.passMsg = "";
  }
  if (lockAppliesTo(readKey())) {
    ui.shiftLock = true;
    ui.shiftEnded = true;
    ui.cashier = false;
    ui.shiftLoading = false;
    ui.gate = "shift";
    ui.managerUnlocked = false;
    ui.badLink = false;
  } else if (!ui.cashier && !ui.gate && !ui.cashierExit && state.cashierSession && state.shift && state.cashierSession.token === state.shift.token && Date.now() < state.shift.end) {
    ui.cashier = true;

    ui.shiftLoading = false;
    ui.badLink = false;
    ui.settings = false;
    ui.drawer = false;
    ui.sheet = "";
    ui.tab = "sell";
  } else if (!ui.cashier && !ui.gate && !ui.shiftLoading && !ui.managerUnlocked && state.profile === "manager" && state.pinHash) {
    ui.gate = "pin";
    ui.passMsg = ui.passMsg || "";
  }
  if (ui.cashier && state.shift && Date.now() >= state.shift.end) {
    endShift();
  } else if (ui.cashier && !state.shift && !ui.badLink && !ui.shiftLoading) {
    lockClosedShift((readKey() || ""), "closed");
  }
  const main = document.getElementById("main");
  if (!main) return;
  main.replaceChildren();
  document.body.classList.toggle("noscroll", !!(ui.drawer || ui.sheet || ui.gate));
  document.documentElement.dataset.cashier = ui.cashier ? "1" : "0";
  let view;
  if (ui.shiftLock || ui.gate === "shift") view = endedView();
  else if (ui.shiftLoading) view = loadingView();

  else if (ui.cashier) view = cashierShell();
  else if (ui.gate === "pin") view = pinGate();

  else view = shell();
  main.append(view);
  applyPrivacyCurtain();
}

function bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let text = "";
  for (let i = 0; i < bytes.length; i++) text += String.fromCharCode(bytes[i]);
  return btoa(text);
}
function b64ToBuf(text) {
  const raw = atob(text);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return bytes;
}
function randomBytes(n) {
  const bytes = new Uint8Array(n);
  crypto.getRandomValues(bytes);
  return bytes;
}

async function enrollDevice() {
  if (!window.PublicKeyCredential || !navigator.credentials) {
    toast("Biometrics unavailable in this browser. Use Solo PIN instead.", true);
    return;
  }
  const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  if (!available) {
    toast("Fingerprint or Face ID is not available on this browser. Use Solo PIN.", true);
    return;
  }
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge: randomBytes(32),
      rp: { name: "Tabaara" },
      user: { id: randomBytes(16), name: "owner", displayName: "Tabaara owner" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" },
      timeout: 60000
    }
  });
  state.deviceCred = bufToB64(cred.rawId);
  state.deviceLock = true;
  save();
  toast("Fingerprint / Face ID lock enabled for Solo.");
}
async function verifyDevice() {
  const cred = await navigator.credentials.get({
    publicKey: {
      challenge: randomBytes(32),
      allowCredentials: [{ type: "public-key", id: b64ToBuf(state.deviceCred) }],
      userVerification: "required",
      timeout: 60000
    }
  });
  if (!cred) throw new Error("Cancelled");
  ui.gate = "";
  ui.passMsg = "";
  render();
}

function commitSale() {
  const pending = ui.pending;
  if (!pending) return;
  const book = ledger();
  const product = book.products.find((p) => p.id === pending.id);
  if (!product || pending.qty > product.stock + 1e-9) {
    ui.sheet = "";
    toast("Stock changed. Try again.", true);
    return;
  }
  product.stock = roundQty(product.stock - pending.qty);
  const unit = pending.unitPrice != null ? pending.unitPrice : product.sellingPrice;
  const total = Math.round(pending.qty * unit);
  const sale = {
    id: uid(), productId: product.id, name: product.name, unit: product.unit, qty: pending.qty,
    unitPrice: unit, costPrice: product.costPrice, total, date: iso(), at: Date.now(),
    by: ui.cashier ? cashierLabel() : "solo", sample: false, deleted: false
  };
  book.sales.unshift(sale);
  if (ui.cashier) {
    logInbox({ id: uid(), at: sale.at, kind: "sale", title: cashierLabel() + " · " + t("sell"), detail: product.name + " · " + qfmt(sale.qty) + " " + product.unit, amount: total });
    if (ui.cashier && typeof pushShiftEntry === "function") {
      pushShiftEntry({ id: sale.id, kind: "sale", title: t("sell"), detail: product.name + " · " + qfmt(sale.qty) + " " + product.unit, amount: total, by: cashierLabel(), sale });
    }
  }
  ui.sheet = "";
  ui.pending = null;
  ui.qty[product.id] = "1";
  if (ui.price) delete ui.price[product.id];
  save();
  toast(t("sold") + " " + qfmt(sale.qty) + " " + product.unit + " " + product.name + ". " + qfmt(product.stock) + " " + t("left"));
}

function checkPin(pin) {
  const now = Date.now();
  if (now < (state.pinLockUntil || 0)) {
    const mins = Math.ceil((state.pinLockUntil - now) / 60000);
    ui.passMsg = "Too many tries. Try again in " + mins + " minute" + (mins === 1 ? "" : "s") + ".";
    return false;
  }
  if ((state.pinLockUntil || 0) && now >= state.pinLockUntil) {
    state.pinLockUntil = 0;
    state.pinFails = 0;
  }

  const entered = digits(pin);
  const correct = entered.length === 4 && sha256(entered) === state.pinHash;
  if (!correct) {
    state.pinFails = Math.min(5, (state.pinFails || 0) + 1);
    const remaining = 5 - state.pinFails;

    if (remaining === 0) {
      state.pinLockUntil = now + 60 * 1000;
      state.pinFails = 0;
      ui.passMsg = "Too many tries. Locked for 1 minute.";
    } else {
      ui.passMsg = "Wrong PIN. " + remaining + " attempt" + (remaining === 1 ? "" : "s") + " left.";
    }
    save();
    return false;
  }

  state.pinFails = 0;
  state.pinLockUntil = 0;
  ui.passMsg = "";
  save();
  return true;
}

    if (ui.cashier) return;
    const book = ledger();
    const sale = book.sales.find((s) => s.id === el.dataset.id);
    if (!sale || sale.deleted || !canSoftDelete(sale)) return;
    const product = book.products.find((p) => p.id === sale.productId);
    if (product) product.stock = roundQty(product.stock + sale.qty);
    sale.deleted = true;
    sale.deletedAt = Date.now();
    if (ui.cashier || state.profile === "manager") {
      logInbox({ id: uid(), at: sale.deletedAt, kind: "sale", title: t("deletedWord") + " · " + t("sell"), detail: sale.name + " · " + qfmt(sale.qty) + " " + sale.unit, amount: sale.total });
    }
    save();
    toast(t("saleDeleted"));
  },
  "restore-sale"(el) {
    if (ui.cashier) return;
    const book = ledger();
    const sale = book.sales.find((s) => s.id === el.dataset.id);
    if (!sale || !sale.deleted) return;
    const product = book.products.find((p) => p.id === sale.productId);
    if (!product) { toast(t("restoreMissingProduct"), true); return; }
    if (sale.qty > product.stock + 1e-9) { toast(t("restoreStockShort"), true); return; }
    product.stock = roundQty(product.stock - sale.qty);
    sale.deleted = false;
    sale.deletedAt = 0;
    save();
    toast(t("saleRestored"));
  },
  edit(el) {
    if (ui.cashier) return;
    const product = el.dataset.id ? productById(el.dataset.id) : null;
    ui.sheet = "product";
    ui.bind = product
      ? { id: product.id, name: product.name, unit: product.unit, stock: String(product.stock), cost: String(product.costPrice), sell: String(product.sellingPrice) }
      : { id: "", name: "", unit: "piece", stock: "", cost: "", sell: "" };
    render();
  },
  "save-product"() {
    if (ui.cashier) return;
    const name = String(ui.bind.name || "").trim();
    if (!name) { toast("Give the product a name.", true); return; }
    const book = ledger();
    const next = {
      name, unit: ui.bind.unit || "piece",
      stock: roundQty(Math.max(0, parseQty(ui.bind.stock) || Number(ui.bind.stock) || 0)),
      costPrice: money(ui.bind.cost), sellingPrice: money(ui.bind.sell), sample: false
    };
    if (ui.bind.id) {
      const product = book.products.find((p) => p.id === ui.bind.id);
      if (product) Object.assign(product, next);
    } else {
      book.products.unshift(Object.assign({ id: uid() }, next));
    }
    ui.sheet = "";
    save();
    render();
  },
  "del-product"() {
    if (ui.cashier || !ui.bind.id) return;
    const book = ledger();
    book.products = book.products.filter((p) => p.id !== ui.bind.id);
    ui.sheet = "";
    save();
    render();
  },
  recv(el) {
    if (ui.cashier) return;
    ui.sheet = "recv";
    ui.bind = { id: el.dataset.id, qty: "5" };
    render();
  },
  "recv-n"(el) { ui.bind.qty = el.dataset.n; render(); },
  "save-recv"() {
    const product = productById(ui.bind.id);
    const add = parseQty(ui.bind.qty);
    if (product && add > 0) product.stock = roundQty(product.stock + add);
    ui.sheet = "";
    save();
    render();
  },
  "clear-sample"() {
    if (ui.cashier) return;
    const book = ledger();
    book.products = book.products.filter((p) => !p.sample);
    book.sales = book.sales.filter((s) => !s.sample);
    book.expenses = book.expenses.filter((e) => !e.sample);
    book.receivables = (book.receivables || []).filter((d) => !d.sample);
    book.payables = (book.payables || []).filter((d) => !d.sample);
    if (Array.isArray(book.debts)) book.debts = book.debts.filter((d) => !d.sample);
    save();
    toast("Example items removed.");
  },
  book(el) { ui.book = el.dataset.book; render(); },
  period(el) { ui.period = el.dataset.period; render(); },
  print() { window.print(); },
  download() {
    const blob = new Blob([reportText()], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "tabaara-" + (ui.book === "petty" ? "petty" : "profit") + "-" + iso() + ".txt";
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1200);
  },
  "exp-open"() {
    ui.sheet = "expense";
    ui.bind.expId = "";
    ui.bind.cat = ui.bind.cat || "Transport";
    ui.bind.amount = "";
    ui.bind.note = "";
    render();
  },
  "edit-exp"(el) {
    const book = ledger();
    const exp = book.expenses.find((e) => e.id === el.dataset.id);
    if (!exp || !canEditExpense(exp)) {
      toast(t("expExpired"), true);
      return;
    }
    ui.sheet = "expense";
    ui.bind.expId = exp.id;
    ui.bind.cat = exp.category || "Transport";
    ui.bind.amount = String(exp.amount);
    ui.bind.note = exp.note || "";
    render();
  },
  "del-exp"(el) {
    const book = ledger();
    const exp = book.expenses.find((e) => e.id === el.dataset.id);
    if (!exp || exp.deleted || !canSoftDelete(exp)) return;
    exp.deleted = true;
    exp.deletedAt = Date.now();
    if (ui.cashier || state.profile === "manager") {
      logInbox({
        id: uid(), at: Date.now(), kind: "expense", title: t("deletedWord") + " · " + t("petty"),
        detail: catLabel(exp.category) + (exp.note ? " · " + exp.note : ""), amount: exp.amount
      });
    }
    save();
    toast(t("expDeleted"));
  },
  "quick-exp"(el) {
    ui.bind.cat = el.dataset.cat || "Transport";
    ui.bind.note = el.dataset.label || "";
    render();
  },
  cat(el) { ui.bind.cat = el.dataset.cat; render(); },
  "save-exp"() { saveExpense(); },
  "debt-open"() { ui.tab = "debts"; ui.settings = false; ui.sheet = ""; render(); },
  dir() {},
  "save-rec"() { saveLedgerDebt("rec"); },
  "save-pay"() { saveLedgerDebt("pay"); },
  "save-debt"() { saveLedgerDebt("rec"); },
  paid(el) {
    const book = ledger();
    const pools = [].concat(book.receivables || [], book.payables || []);
    const debt = pools.find((d) => d.id === el.dataset.id);
    if (!debt) return;
    debt.settled = true;
    save();
    render();
  },
  "save-shop"() {
    ledger().shopName = String(ui.bind.shop || "").trim() || "My Shop";
    ui.bind.shop = null;
    save();
    toast("Shop name saved.");
  },
  "pin-open"() { ui.sheet = "pin"; ui.bind = { old: "", next: "", next2: "" }; render(); },
  "save-pin"() {
    const oldPin = digits(ui.bind.old || "");
    const next = digits(ui.bind.next || "");
    const next2 = digits(ui.bind.next2 || "");
    if (state.pinHash && sha256(oldPin) !== state.pinHash) { toast("Current PIN is wrong.", true); return; }
    if (!next && state.pinHash) {
      state.pinHash = "";
      ui.sheet = "";
      save();
      toast("Manager PIN removed.");
      return;
    }
    if (next.length !== 4 || next !== next2) { toast("Enter the same 4 digits twice.", true); return; }
    state.pinHash = sha256(next);
    ui.sheet = "";
    save();
    toast("Manager PIN saved.");
  },
  "solo-pin-open"() { ui.sheet = "solo-pin"; ui.bind = { old: "", next: "", next2: "" }; render(); },
  "save-solo-pin"() {
    const oldPin = digits(ui.bind.old || "");
    const next = digits(ui.bind.next || "");
    const next2 = digits(ui.bind.next2 || "");
    if (state.soloPinHash && sha256(oldPin) !== state.soloPinHash) { toast("Current Solo PIN is wrong.", true); return; }
    if (!next && state.soloPinHash) {
      state.soloPinHash = "";
      ui.sheet = "";
      save();
      toast("Solo PIN removed.");
      return;
    }
    if (next.length !== 4 || next !== next2) { toast("Enter the same 4 digits twice.", true); return; }
    state.soloPinHash = sha256(next);
    ui.sheet = "";
    save();
    toast("Solo PIN saved.");
  },
  "pick-hours"(el) { ui.hours = el.dataset.hours; ui.bind.hours = el.dataset.hours; render(); },
  "owner-signin"() {
    const email = String(ui.bind.ownerEmail || "").trim();
    const pass = String(ui.bind.ownerPass || "");
    if (email && pass && typeof ownerSignIn === "function") ownerSignIn(email, pass);
  },
  "owner-signup"() {
    const email = String(ui.bind.ownerEmail || "").trim();
    const pass = String(ui.bind.ownerPass || "");
    if (email && pass && typeof ownerSignUp === "function") ownerSignUp(email, pass);
  },
  "owner-signout"() { if (typeof ownerSignOut === "function") ownerSignOut(); },
  "gen-shift"() {
    if (state.profile !== "manager" || ui.cashier) return;
    if (!state.pinHash) { toast("Set a Manager PIN before creating a cashier shift.", true); return; }
    const hours = Math.min(24, Math.max(1, Number(ui.bind.hours || ui.hours) || 8));
    const cashierName = String(ui.bind.cashierName || "").trim() || "Cashier";
    if (state.shift) {
      logInbox({
        id: uid(), at: Date.now(), kind: "shift", title: "Shift replaced",
        detail: "The previous cashier link was stopped", amount: 0
      });
    }
    const code = String(Math.floor(100000 + Math.random() * 900000));
    const token = "t_" + Math.random().toString(36).slice(2, 12);
    const start = Date.now();
    state.shift = { id: uid(), keyHash: sha256(code), token, hours, start, end: start + hours * 3600000, cashierName };
    ui.freshCode = token;
    if (typeof registerShiftToken === "function") registerShiftToken(token, hours, cashierName);
    ui.hours = String(hours);
    save();
    render();
  },
  "end-shift"() {
    endShift();
    toast("Shift archived into the books.");
  },
  "copy-link"(el) {
    const link = el.dataset.link || "";
    const done = () => toast("Link copied.");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done).catch(() => toast(link));
    } else toast(link);
  },
  "open-link"(el) {
    const link = el.dataset.link || "";
    const code = (link.match(/[#&]k=([^&]+)/) || [])[1] || "";
    const decoded = decodeURIComponent(code);
    if (location.hash !== "#k=" + encodeURIComponent(decoded)) location.hash = "k=" + encodeURIComponent(decoded);
    openShiftLink(decoded);
    render();
  },
  "leave-cashier"() {
    if (ui.cashier || state.cashierSession) {
      if (!state.pinHash) { render(); return; }
      ui.cashierExit = true;
      ui.cashier = false;
      ui.gate = "pin";
      ui.passMsg = "";
      ui.bind.pin = "";
      render();
      return;
    }
    if (state.shiftLock || ui.shiftLock) {
      ui.gate = "shift";
      ui.shiftLock = true;
      ui.shiftEnded = true;
      ui.cashier = false;
      ui.passMsg = "";
      ui.bind.pin = "";
      render();
      return;
    }
    history.replaceState(null, "", location.pathname);
    const leavingTill = ui.cashier || ui.shiftEnded;
    ui.badLink = false;
    ui.cashier = false;
    ui.shiftEnded = false;
    if (leavingTill) {
      if (state.pinHash) { ui.gate = "pin"; ui.passMsg = ""; render(); return; }
      state.profile = "manager";
      startShiftListener();
      ui.tab = "inbox";
      save();
    }
    render();
  },
  "export-backup"() {
    const data = JSON.parse(JSON.stringify(state));
    delete data._migrated;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "tabaara-backup-" + iso() + ".json";
    link.click();
    state.lastBackupAt = Date.now();
    save();
    setTimeout(() => URL.revokeObjectURL(link.href), 1500);
    toast(t("backupExported"));
  },
  "import-backup"() {
    const input = document.getElementById("backup-file");
    if (!input) return;
    input.value = "";
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || !data.solo || !data.manager || !Array.isArray(data.solo.products)) {
            toast("Invalid backup file.", true);
            return;
          }
          if (!confirm(t("confirmImport"))) return;
          Object.assign(state, data);
          normalize(state);
          save();
          toast(t("backupImported"));
          setTimeout(() => location.reload(), 800);
        } catch (err) {
          toast("Could not read backup.", true);
        }
      };
      reader.readAsText(file);
    };
    input.click();
  },
  "export-shift"() {
    const book = state.manager;
    const recent = {
      sales: (book.sales || []).filter(s => s.by && s.by !== "solo" && s.by !== "manager"),
      expenses: (book.expenses || []).filter(e => e.by && e.by !== "solo" && e.by !== "manager"),
      receivables: book.receivables || [],
      payables: book.payables || []
    };
    const blob = new Blob([JSON.stringify(recent, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "tabaara-shift-" + iso() + ".json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1500);
    toast("Shift file downloaded.");
  },
  "import-shift"() {
    const input = document.getElementById("shift-file");
    if (!input) return;
    input.value = "";
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || !Array.isArray(data.sales)) { toast("Invalid shift file.", true); return; }
          const book = state.manager;
          const existing = new Set((book.sales || []).map(s => s.id));
          let added = 0;
          (data.sales || []).forEach(s => { if (s && s.id && !existing.has(s.id)) { book.sales.unshift(s); added++; } });
          (data.expenses || []).forEach(e => { if (e && e.id && !(book.expenses || []).some(x => x.id === e.id)) book.expenses.unshift(e); });
          (data.receivables || []).forEach(d => { if (d && d.id && !(book.receivables || []).some(x => x.id === d.id)) book.receivables.unshift(d); });
          (data.payables || []).forEach(d => { if (d && d.id && !(book.payables || []).some(x => x.id === d.id)) book.payables.unshift(d); });
          save();
          toast(added + " sales imported into Manager books.");
          render();
        } catch (err) { toast("Could not read shift file.", true); }
      };
      reader.readAsText(file);
    };
    input.click();
  }
};

document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "stop") return;
  if (act === "close" && e.target.closest("[data-act='stop']") && !e.target.closest("button")) return;
  const fn = actions[act];
  if (fn) fn(el);
});
document.body.addEventListener("input", (e) => {
  const target = e.target;
  if (target.dataset && target.dataset.bind) ui.bind[target.dataset.bind] = target.value;
  if (target.dataset && target.dataset.qty) ui.qty[target.dataset.qty] = target.value;
  // Auto-unlock Manager PIN when 4 correct digits are entered.
  if ((ui.gate === "pin" || ui.gate === "shift") && target.dataset.bind === "pin" && digits(target.value).length === 4) {
    if (ui.gate === "shift") {
      actions["do-shift-pin"]();
    } else if (checkPin(target.value)) {
      ui.gate = "";
      ui.passMsg = "";
      ui.cashier = false;
      ui.shiftEnded = false;
      ui.badLink = false;
      state.shiftLock = null;
      ui.shiftLock = false;
      state.profile = "manager";
      ui.managerUnlocked = true;
      if (typeof startShiftListener === "function") startShiftListener();
      ui.tab = "inbox";
      history.replaceState(null, "", location.pathname);
      save();
      render();
    }
  }
});
document.body.addEventListener("change", (e) => {
  const target = e.target;
  if (target.dataset && target.dataset.bind) ui.bind[target.dataset.bind] = target.value;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && (ui.drawer || ui.sheet)) {
    ui.drawer = false;
    ui.sheet = "";
    render();
  }
});

function tick() {
  document.querySelectorAll("[data-clock]").forEach((el) => {
    el.textContent = state.shift ? remain(state.shift.end) : "Ended";
  });
  if (ui.cashier && state.shift && Date.now() >= state.shift.end) {
    endShift();
    render();
    return;
  }
  if (!state.shiftLock && readKey() && state.shift && readKey() === state.shift.token && Date.now() >= state.shift.end) {
    lockClosedShift(state.shift.token, "expired");
    render();
    return;
  }
  if (!typing() && !ui.sheet && !ui.drawer && document.querySelector("[data-act='edit-exp']")) {
    const book = ledger();
    if (!book.expenses.some((e) => canEditExpense(e))) render();
  }
}
function bindChannel() {
  try {
    save.bc = new BroadcastChannel("tabaara-v1");
    save.bc.onmessage = () => {
      if (typing()) return;
      state = load();
      render();
    };
  } catch (err) { /* older browsers */ }
  window.addEventListener("storage", (e) => {
    if (e.key !== KEY || typing()) return;
    state = load();
    render();
  });
  window.addEventListener("hashchange", () => {
    const key = readKey();
    if (!key && state.cashierSession && state.shift && state.cashierSession.token === state.shift.token && Date.now() < state.shift.end) {
      history.replaceState(null, "", location.pathname + "#k=" + encodeURIComponent(state.shift.token));
      ui.cashier = true;
      ui.gate = "";
      render();
      return;
    }
    if (!key) return;
    openShiftLink(key);
    render();
  });
  window.addEventListener("online", () => { if (!typing()) render(); });
  window.addEventListener("offline", () => { if (!typing()) render(); });
  const scheme = window.matchMedia("(prefers-color-scheme: dark)");
  if (scheme.addEventListener) scheme.addEventListener("change", () => { if (state.theme === "system") applyTheme(); });
}

function enter() {
  const splash = document.getElementById("splash");
  const main = document.getElementById("main");
  if (splash) splash.hidden = true;
  if (main) main.hidden = false;
  render();
}
function boot() {
  initSync();
  state = load();
  const migrated = !!(state && state._migrated);
  ui = freshUi();
  ui.langOpen = !state.helpSeen;
  ui.modesOpen = state.helpSeen && !state.modesIntroSeen;
  ui.helpOpen = false;
  applyTheme();
  bindChannel();
  const key = readKey();
  if (lockAppliesTo(key)) {
    ui.shiftLock = true;
    ui.shiftEnded = true;
    ui.cashier = false;
    ui.gate = "shift";
    ui.managerUnlocked = false;
    ui.badLink = false;
    ui.bind.pin = "";
  } else if (state.cashierSession && state.shift && state.cashierSession.token === state.shift.token && Date.now() < state.shift.end) {
    // A cashier session survives refresh and a removed hash. Do not fall
    // through to Manager/Solo just because the URL fragment was cleared.
    ui.cashier = true;
    ui.gate = "";
    ui.badLink = false;
    ui.shiftEnded = false;
    ui.settings = false;
    ui.drawer = false;
    ui.tab = "sell";
    if (location.hash !== "#k=" + encodeURIComponent(state.shift.token)) {
      history.replaceState(null, "", location.pathname + "#k=" + encodeURIComponent(state.shift.token));
    }
    listenForShiftEnd(state.shift.token);
  } else if (key) {
    openShiftLink(key);
  } else if (state.profile === "manager" && state.pinHash) {
    ui.gate = "pin";
    ui.passMsg = "";
    ui.bind.pin = "";
  } else if (state.profile === "solo" && soloLocked()) {
    ui.gate = "solo";
  }
  if (migrated && state.splashSeen) save();
  if (state.splashSeen) {
    enter();
  } else {
    setTimeout(() => {
      state.splashSeen = true;
      save();
      enter();
    }, reduceMotion() ? 600 : 2000);
  }
  setInterval(tick, 1000);
  document.addEventListener("visibilitychange", applyPrivacyCurtain);
  window.addEventListener("blur", applyPrivacyCurtain);
  window.addEventListener("focus", applyPrivacyCurtain);
}
boot();
</script>
</body>
